citation:
  display:
    en: Citation
    fr: Citation
  fields:
    title:
      data_type: text
      label:
        en: Title
        fr: Titre
      description:
        en: Enter the title of the work being cited.
        fr: Entrez le titre de l'ouvrage cité.
      order: 10
      multilingual: yes
      unique: yes
      json_api:
        mapping: title
thesaurus:
  display:
    en: Thesaurus
    fr: Thésaurus
  validation:
    required:
      - citation
  fields:
    citation:
      data_type: inline_entity_ref
      entity_type: citation
      label:
        en: Citation
        fr: Citation
      description:
        en: Reference information for the thesaurus.
        fr: Informations de référence pour le thésaurus.
      order: 0
      unique: yes
      json_api:
        mapping: citation
    type:
      data_type: text
      label:
        en: Keyword Type
        fr: Type de mot-clé
      description:
        en: Enter the keyword type that best describes the keywords that are part of this thesaurus.
        fr: Entrez le type de mot-clé qui décrit le mieux les mots-clés qui font partie de ce thésaurus.
      order: 10
      json_api:
        mapping: type
    prefix:
      data_type: text
      label:
        en: Prefix
        fr: Préfixe
      description:
        en: This will be used in some metadata files to separate keywords by thesaurus when the whole thesaurus cannot be used.
        fr: Cela sera utilisé dans certains fichiers de métadonnées pour séparer les mots-clés par thésaurus lorsque l'ensemble du thésaurus ne peut pas être utilisé.
      order: 20
      unique: yes
      json_api:
        mapping: prefix
variable:
  display:
    en: Variable
    fr: Variable
  is_component: yes
  hidden: yes
keyword:
  display:
    en: Keyword
    fr: Mot-clé
  validation:
    required:
      - keyword
  fields:
    keyword:
      data_type: multitext
      multilingual: yes
      label:
        en: Keyword
        fr: Mot-clé
      description:
        en: Enter the text that should be used in the metadata files. If there is an official value from a controlled list, it should go in the "UND" field.
      order: 0
      json_api:
        mapping: keyword
      unique:
        - thesaurus
    description:
      data_type: multitext
      multilingual: yes
      label:
        en: Extended Description
        fr: Description détaillée
      description:
        en: Provide additional descriptive information about this keyword. This is not added to the metadata files.
        fr: Fournissez des informations descriptives supplémentaires sur ce mot clé. Ceci n'est pas ajouté aux fichiers de métadonnées.
      order: 20
    thesaurus:
      data_type: entity_ref
      entity_type: thesaurus
      label:
        en: Thesaurus
        fr: Thésaurus
      description:
        en: Select a thesaurus that this keyword belongs to.
        fr: Sélectionnez un thésaurus auquel ce mot-clé appartient.
      order: 10
locale:
  display:
    en: Locale
    fr: Paramètres régionaux
  fields:
    internal:
      label:
        en: Internal Code
        fr: Code interne
      description:
        en: # TODO
        fr: # TODO
      data_type: text
      order: 35
      json_api:
        mapping: internal
      unique: true
    ietf_bcp47:
      label:
        en: BCP-47 Code
        fr: Code BCP-47
      description:
        en: Enter the most appropriate IETF BCP 47 language code.
        fr: Entrez le code de langue le plus approprié de la norme IETF BCP 47.
      data_type: text
      order: 35
      json_api:
        mapping: ietf_bcp47
