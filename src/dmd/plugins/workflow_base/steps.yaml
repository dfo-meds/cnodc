publish_dataset:
  label:
    en: Publish Dataset
    fr: Publier l'ensemble de données
  step_type: action
  action: dmd.plugins.workflow_base.util.step_publish_dataset

flag_dataset_for_review:
  label:
    en: Block Dataset Edits
    fr: Bloquer les modifications de l'ensemble de données
  step_type: action
  action: dmd.plugins.workflow_base.util.step_block_dataset_edits
activate_dataset:
  label:
    en: Activate Dataset
    fr: Activer l'ensemble de données
  step_type: action
  action: dmd.plugins.workflow_base.util.step_activate_dataset
return_to_draft:
  label:
    en: Return to Draft
    fr: Revenir au brouillon
  step_type: action
  action: dmd.plugins.workflow_base.util.step_return_to_draft

upload_metadata:
  label:
    en: Upload Metadata
    fr: Télécharger les métadonnées
  step_type: batch
  action: dmd.plugins.workflow_base.util.step_upload_metadata

superuser_approval:
  label:
    en: Superuser Approval
    fr: Approbation superutilisateur
  step_type: gate
  require_permission: superuser

fetch_translation:
  label:
    en: Get Translation
    fr: Obtenir la traduction
  step_type: batch
  action: dmd.plugins.workflow_base.util.step_fetch_translation
remove_in_translation_flag:
  label:
    en: Allow Edits
    fr: Autoriser les modifications
  step_type: action
  action: dmd.plugins.workflow_base.util.step_remove_translation_flag

trigger_publication:
  label:
    en: Start Publication
    fr: Commencer la publication
  step_type: action
  action: dmd.plugins.workflow_base.util.step_start_publication

interrupt_live_flow:
  label:
    en: Convert to Batch Mode
    fr: Convertir en mode batch
  step_type: batch
  action: dmd.plugins.workflow_base.util.step_noop
