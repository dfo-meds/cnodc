dataset_publication:
    direct_publish:
        label:
          en: Direct Publish
          fr: Publication directe
        steps:
          - publish_dataset
        enabled: true
        permission: workflow.publish.direct
    super_user_publish:
      label:
        en: Superuser Approval
        fr: Approbation du superutilisateur
      steps:
        - superuser_approval
        - publish_dataset
dataset_activation:
    direct_activation:
        label:
          en: Direct Activation
          fr: Activation directe
        steps:
          - flag_dataset_for_review
          - activate_dataset
        enabled: true
        permission: workflow.activate.direct
    super_user_activation:
      label:
        en: Superuser Approval
        fr: Approbation du superutilisateur
      steps:
        - flag_dataset_for_review
        - superuser_approval
        - activate_dataset
      cleanup:
        - return_to_draft
    activate_and_publish:
      label:
        en: Direct Activation & Publication
        fr: Activation et publication directe
      steps:
        - flag_dataset_for_review
        - activate_dataset
        - trigger_publication
      permission: workflow.activate_and_publish
      cleanup:
        - return_to_draft
text_translation:
    default:
      label:
        en: Text Translation (default)
        fr: Traduction de texte (défaut)
      steps:
        - fetch_translation
      cleanup:
        - remove_in_translation_flag
      enabled: true
