<html>
<head>
    <title>NODB Schema</title>
    <style>
        body {
            font-family: Calibri, sans-serif;
            font-size: 1em;
        }
        td, th {
            text-align: left;
            margin: 0;
            vertical-align: top;
        }
        thead th {
            font-weight: bold;
            font-size: 1.1em;
            background-color: #000000;
            color: #FFFFFF;
        }
        table {
            width: 1000px;
        }
        th span.version {
            font-size: 0.8em;
            font-weight: normal;
            color: #006600;
        }
        th span.removed {
            font-size: 0.8em;
            font-weight: normal;
            color: #660000;
        }
        div.removed h2 {
            text-decoration: line-through;
            color: #660000;
        }
        tr.removed span.full_name {
            text-decoration: line-through;
            color: #660000;
        }
        h2 {
            margin-bottom: 0;
        }
        h2 span.version {
            font-size: 0.8em;
            font-weight: normal;
            color: #006600;
        }
        p.removed {
            font-size: 0.9em;
            font-weight: normal;
            color: #660000;
        }
        p.comment {
            color: #666666;
            margin: 0;
        }
        div.table {
            margin-bottom: 24px;
        }
        td.data_type {
            width: 150px;
        }
        td.properties {
            width: 150px;
        }
        td.column_name {
            width: 250px;
        }
        td.comments {
            width: 450px;
        }

</head>
<body>
<h1>NODB Schema</h1>
{{ CONTENT }}

</html>
